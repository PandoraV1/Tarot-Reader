<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tarot Reader</title>
    <!-- Fontawsone -->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700|Lato:400,700,400italic,700italic" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Your Styles -->
    <link href="{{ url_for('static', filename='styles/style.css') }}" rel="stylesheet">
    <style>
        /* Floating card backs */
        .floating-cards {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 200px;
            margin: 0 auto 3rem auto;
        }

        .floating-card {
            position: absolute;
            top: 15px;
            width: 110px;
            height: 170px;
            object-fit: cover;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            animation: floatCard 6s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .card-pos-1 { left: 5%; animation-delay: 0s; }
        .card-pos-2 { left: 25%; animation-delay: 1s; }
        .card-pos-3 { left: 45%; animation-delay: 2s; }
        .card-pos-4 { left: 65%; animation-delay: 3s; }
        .card-pos-5 { left: 85%; animation-delay: 4s; }

        .floating-card:hover {
            transform: translateY(-25px) scale(1.05);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            z-index: 20;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        @media (max-width: 768px) {
            .floating-card {
                width: 85px;
                height: 130px;
            }
            .card-pos-1 { left: 2%; }
            .card-pos-2 { left: 20%; }
            .card-pos-3 { left: 38%; }
            .card-pos-4 { left: 56%; }
            .card-pos-5 { left: 74%; }
        }
    </style>
</head>
<body id="page-top">
    <!-- Starry sidebar - Left -->
    <div class="starry-sidebar"></div>
    <!-- Starry sidebar - Right -->
    <div class="starry-sidebar starry-sidebar-right"></div>
    
    <div class="main-content">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">Tarot Reader</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive">
                <i class="fas fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form action="{{ url_for('cards') }}" method="get" class="d-inline">
                            <button type="submit" class="nav-link btn btn-link p-2">Get Reading</button>
                        </form>
                    </li>
                    <li class="nav-item">
                        <form action="{{ url_for('glossary') }}" method="get" class="d-inline">
                            <button type="submit" class="nav-link btn btn-link p-2">Card Glossary</button>
                        </form>
                    </li>
                    <li class="nav-item">
                        <form action="{{ url_for('history') }}" method="get" class="d-inline">
                            <button type="submit" class="nav-link btn btn-link p-2">History</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Masthead -->
    <header class="masthead text-white text-center">
        <div class="container d-flex align-items-center flex-column">
            
            <!-- floating Card Backs -->
            <div class="floating-cards">
                <img src="{{ url_for('static', filename='images/card_back.jpg') }}" alt="Card back" class="floating-card card-pos-1">
                <img src="{{ url_for('static', filename='images/card_back.jpg') }}" alt="Card back" class="floating-card card-pos-2">
                <img src="{{ url_for('static', filename='images/card_back.jpg') }}" alt="Card back" class="floating-card card-pos-3">
                <img src="{{ url_for('static', filename='images/card_back.jpg') }}" alt="Card back" class="floating-card card-pos-4">
                <img src="{{ url_for('static', filename='images/card_back.jpg') }}" alt="Card back" class="floating-card card-pos-5">
            </div>

            <h1 class="masthead-heading mb-4">Tarot Reader</h1>
            <div class="divider-custom divider-light mb-4">
                <div class="divider-custom-line"></div>
                <div class="divider-custom-icon"><i class="fas fa-star"></i></div>
                <div class="divider-custom-line"></div>
            </div>
            <p class="masthead-subheading font-weight-light mb-5">Mystical Insights Await</p>

            <form action="{{ url_for('cards') }}" method="get">
                <button type="submit" class="btn btn-xl btn-tarot">Begin Reading</button>
            </form>
        </div>
    </header>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </div>
</body>
</html>
