<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot home</title>
    <link href="{{ url_for('static', filename='styles/style.css') }}" rel="stylesheet" />
    <style> body {
        border: 30px solid #4B003D;
        margin: 0;
        padding: 10px;
    } 
    .mybutton {
        background-color: #26021F; /* button's background color */
        color: white; /* text color */
        padding: 10px 20px; /* Adds space inside the button */
        border: none; /* Removes the default border */
        border-radius: 5px; /* Rounds the corners */
        cursor: pointer; /* changes cursor on hover */
    }
    .mybutton:hover {
        background-color: #430437;
    }</style>
</head>
<body>
    <div class="header-bar">
        <div class="header-center">
            <form action="{{ url_for('cards') }}" method="get">
                <button type="submit">Get Reading</button>
            </form>

            <form action="{{ url_for('home') }}" method="get">
                <button type="submit">Tarot Reader</button>
            </form>

            <form action="{{ url_for('glossary') }}" method="get">
                <button type="submit">Card Glossary</button>
            </form>
        </div>

        <div class="header-right">
            <button type="button">History</button>
        </div>
    </div>

    <div style="margin-top: 70px">
        <h1>Tarot Test</h1>

        <form method="post">
            <input type="text" name="Q" id="Q" placeholder="Enter your Question"
                value="{{ user_question or '' }}" />
            <button class="mybutton">Submit</button>
        </form>

        {% if drawn_cards %}
        <div class="card-result">
            <h2>Your cards</h2>
                {% for c in drawn_cards %}
                    <div class="single-card">
                        <img src="{{ url_for('static', filename='images/card_' ~ c['id'] ~ '.jpg') }}"
                            alt="{{ c['name'] }}"
                            style="max-width: 300px; height: auto; margin: 0 10px;" />
                        <p>Id: {{ c['id'] }}</p>
                        <p>Name: The {{ c['name'] }}</p>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% if ai_answer %}
            <div class="ai-result">
                <h2>AI Answer</h2>
                <p><strong>Your question:</strong> {{ user_question }}</p>
                <p><strong>Response:</strong> {{ ai_answer }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
