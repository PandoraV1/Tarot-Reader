<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tarot Reading</title>
    <!-- Fontawesome -->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700|Lato:400,700,400italic,700italic" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Styles -->
    <link href="{{ url_for('static', filename='styles/style.css') }}" rel="stylesheet">
    <style>
        /* Page-specific Tarot card styling */
        .tarot-form { max-width: 600px; margin: 2rem auto; }
        .single-card { 
            background: rgba(255,255,255,0.1); 
            border-radius: 15px; 
            padding: 1.5rem; 
            text-align: center; 
            backdrop-filter: blur(10px); 
            border: 2px solid rgba(255,255,255,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
        }
        .single-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        .tarot-card-img {
            width: 250px;        
            height: 350px;       
            object-fit: cover;   
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .card-info h5 { 
            color: #FFD700; 
            font-size: 1.3rem; 
            margin-bottom: 0.5rem;
        }
        .card-info p { 
            color: rgba(255,255,255,0.9); 
            font-size: 1rem;
        }
        .ai-result { 
            background: rgba(75,0,61,0.3); 
            border-radius: 15px; 
            padding: 2rem; 
            max-width: 800px; 
            margin: 3rem auto; 
        }
        select, input[type="text"] { 
            background: rgba(255,255,255,0.9); 
            border: 2px solid var(--tarot-primary); 
            border-radius: 10px; 
            padding: 0.75rem; 
            font-size: 1.1rem; 
        }
        label { 
            font-weight: 700; 
            color: white; 
            display: block; 
            margin-bottom: 0.5rem; 
            font-size: 1.2rem; 
        }

        html, body {
            overflow-y: auto !important;
            height: auto !important;
            min-height: 100vh !important;
        }
        .main-content {
            min-height: calc(100vh - 120px);
            padding-bottom: 3rem;
        }
        
        @media (max-width: 768px) {
            .tarot-card-img { width: 200px; height: 280px; }
        }
    </style>
</head>
<body id="page-top">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">Tarot Reader</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive">
                <i class="fas fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form action="{{ url_for('home') }}" method="get" class="d-inline">
                            <button type="submit" class="nav-link btn btn-link p-2">Home</button>
                        </form>
                    </li>
                    <li class="nav-item">
                        <form action="{{ url_for('cards') }}" method="get" class="d-inline">
                            <button type="submit" class="nav-link btn btn-link p-2">Get Reading</button>
                        </form>
                    </li>
                    <li class="nav-item">
                        <form action="{{ url_for('glossary') }}" method="get" class="d-inline">
                            <button type="submit" class="nav-link btn btn-link p-2">Card Glossary</button>
                        </form>
                    </li>
                    <li class="nav-item">
                        <form action="{{ url_for('history') }}" method="get" class="d-inline">
                            <button type="submit" class="nav-link btn btn-link p-2">History</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Section -->
    <main class="main-content text-white" style="padding-top: 80px; background: inherit;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <!-- Page Header -->
                    <div class="text-center mb-5 py-4">
                        <h1 class="masthead-heading mb-4">Tarot Reading</h1>
                        <div class="divider-custom divider-light mx-auto mb-5" style="max-width: 300px;">
                            <div class="divider-custom-line"></div>
                            <div class="divider-custom-icon"><i class="fas fa-magic"></i></div>
                            <div class="divider-custom-line"></div>
                        </div>
                    </div>

                    <!-- Tarot Form -->
                    <div class="tarot-form">
                        <form method="post">
                            <label for="num_cards">Number of Cards:</label>
                            <select name="num_cards" id="num_cards" class="form-select mb-3 w-100">
                                <option value="1">1 card reading</option>
                                <option value="2">2 card reading</option>
                                <option value="3">3 card reading</option>
                                <option value="4">4 card reading</option>
                                <option value="5">5 card reading</option>
                                <option value="6">6 card reading</option>
                            </select>

                            <input type="text" name="Q" id="Q" class="form-control mb-3 w-100" 
                                   placeholder="Enter your Question" value="{{ user_question or '' }}" />

                            <button type="submit" class="btn btn-xl btn-tarot w-100">Draw Cards</button>
                        </form>
                    </div>

                    <!-- Drawn Cards Display -->
                    {% if drawn_cards %}
                    <div class="card-result mt-5">
                        <h2 class="mb-4 text-center">Your Cards</h2>
                        <div class="row g-4 justify-content-center">
                            {% for c in drawn_cards %}
                            <div class="col-lg-4 col-md-6 col-sm-12">
                                <div class="single-card h-100">
                                    <!-- Card Image -->
                                    <div class="card-image mb-3">
                                        <img src="{{ url_for('static', filename='images/card_' ~ c['id'] ~ '.jpg') }}"
                                             alt="{{ c['name'] }}" 
                                             class="img-fluid tarot-card-img" />
                                    </div>
                                    <!-- Card Info -->
                                    <div class="card-info">
                                        <h5 class="card-title mb-2">The {{ c['name'] }}</h5>
                                        <p class="card-id mb-0"><strong>ID:</strong> {{ c['id'] }}</p>
                                    </div>
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                    {% endif %}

                    <!-- AI Answer Display -->
                    {% if ai_answer %}
                    <div class="ai-result">
                        <h2 class="mb-4"><i class="fas fa-crystal-ball me-3"></i>AI Interpretation</h2>
                        <div class="row">
                            <div class="col-md-3">
                                <p><strong>Your Question:</strong></p>
                            </div>
                            <div class="col-md-9">
                                <p>{{ user_question }}</p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-3">
                                <p><strong>Reading:</strong></p>
                            </div>
                            <div class="col-md-9">
                                <p>{{ ai_answer }}</p>
                            </div>
                        </div>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
