<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tarot Glossary</title>
    <!-- Font Awesome -->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700|Lato:400,700,400italic,700italic" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Your Styles -->
    <link href="{{ url_for('static', filename='styles/style.css') }}" rel="stylesheet">
    <style>
    /* Glossary-specific Tarot styling - FIXED BORDERS */
    .glossary-grid {
        max-width: 1200px;
        margin: 2rem auto;
    }
    .glossary-card {
        display: block !important;
        background: rgba(255,255,255,0.1);
        border-radius: 15px;
        padding: 1.5rem;
        text-align: center;
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255,255,255,0.3) !important;
        transition: all 0.3s ease;
        height: 100%;
        color: white;
        text-decoration: none;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        min-height: 380px;  /* Ensures consistent card height */
    }
    .glossary-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        border-color: rgba(255,255,255,0.6) !important;
        color: white;
        text-decoration: none;
    }
    .glossary-card img {
        width: 180px;
        height: 260px;
        object-fit: cover;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        margin-bottom: 1rem;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }
    .glossary-card h5 {
        color: #FFD700;
        font-size: 1.2rem;
        margin-bottom: 0.5rem;
        font-weight: 700;
    }
    .glossary-card p {
        color: rgba(255,255,255,0.9);
        font-size: 1rem;
        margin: 0;
        font-weight: 500;
    }
    
    /* SCROLLING + FULL GRADIENT FIX */
    html, body {
        overflow-y: auto !important;
        height: auto !important;
        min-height: 100vh !important;
    }
    .main-content {
        min-height: calc(100vh - 120px);
        padding-top: 80px !important;
        padding-bottom: 3rem;
        background: inherit;
    }
    
    @media (max-width: 768px) {
        .glossary-card img { width: 140px; height: 200px; }
        .glossary-card { min-height: 320px; }
    }
    </style>

</head>
<body id="page-top">
    <!-- Navigation (Same as home page) -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">Tarot Reader</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive">
                <i class="fas fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form action="{{ url_for('cards') }}" method="get" class="d-inline">
                            <button type="submit" class="nav-link btn btn-link p-2">Get Reading</button>
                        </form>
                    </li>
                    <li class="nav-item">
                        <form action="{{ url_for('home') }}" method="get" class="d-inline">
                            <button type="submit" class="nav-link btn btn-link p-2">Home</button>
                        </form>
                    </li>
                    <li class="nav-item">
                        <form action="{{ url_for('glossary') }}" method="get" class="d-inline">
                            <button type="submit" class="nav-link btn btn-link p-2">Card Glossary</button>
                        </form>
                    </li>
                    <li class="nav-item">
                        <form action="{{ url_for('history') }}" method="get" class="d-inline">
                            <button type="submit" class="nav-link btn btn-link p-2">History</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Section - SCROLLABLE -->
    <main class="main-content text-white">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-12">
                    <!-- Page Header -->
                    <div class="text-center mb-5 py-4">
                        <h1 class="masthead-heading mb-4">Card Glossary</h1>
                        <div class="divider-custom divider-light mx-auto mb-5" style="max-width: 300px;">
                            <div class="divider-custom-line"></div>
                            <div class="divider-custom-icon"><i class="fas fa-book-open"></i></div>
                            <div class="divider-custom-line"></div>
                        </div>
                        <p class="lead mb-0">Click any card to view detailed meaning</p>
                    </div>

                    <!-- Tarot Card Grid -->
                    <div class="glossary-grid">
                        <div class="row g-4">
                            {% for c in cards %}
                            <div class="col-xl-3 col-lg-4 col-md-6 col-sm-12">
                                <a href="{{ url_for('card_detail', card_id=c['id']) }}" class="glossary-card h-100">
                                    <img src="{{ url_for('static', filename='images/card_' ~ c['id'] ~ '.jpg') }}"
                                         alt="{{ c['name'] }}" />
                                    <h5>The {{ c['name'] }}</h5>
                                    <p>ID: {{ c['id'] }}</p>
                                </a>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
